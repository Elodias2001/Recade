server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Piège nginx : un `add_header` dans un bloc enfant ANNULE tous ceux hérités
  # du parent. Les en-têtes de sécurité sont donc répétés dans chaque `location`
  # qui en ajoute un, sinon ils disparaissent silencieusement de la réponse.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  # Site statique sans script ni ressource tierce : la politique peut être stricte.
  add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
  gzip_min_length 512;

  # URL sans extension : /a-propos sert a-propos.html
  location / {
    try_files $uri $uri/ $uri.html =404;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
    add_header Cache-Control "public, max-age=300" always;
  }

  location /img/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=604800" always;
  }

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
