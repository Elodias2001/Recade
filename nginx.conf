server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/conf.d/securite.conf;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
  gzip_min_length 512;

  # URL sans extension : /a-propos sert a-propos.html
  location / {
    try_files $uri $uri/ $uri.html =404;
    include /etc/nginx/conf.d/securite.conf;
    add_header Cache-Control "public, max-age=300" always;
  }

  # Vignettes de partage. Trois exigences des moissonneurs (WhatsApp, Facebook,
  # LinkedIn, X) : une URL stable, jamais derrière une authentification, et
  # servie avec CORS ouvert. Le nom du fichier porte le contenu, donc le cache
  # peut être long : changer la vignette, c'est changer son nom.
  location /img/og/ {
    include /etc/nginx/conf.d/securite.conf;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    types { image/png png; }
    default_type image/png;
  }

  location /img/ {
    include /etc/nginx/conf.d/securite.conf;
    add_header Cache-Control "public, max-age=604800" always;
  }

  # Icônes : certains clients de messagerie les affichent à côté de l'aperçu.
  location ~* ^/(favicon\.svg|favicon-\d+\.png|apple-touch-icon\.png)$ {
    include /etc/nginx/conf.d/securite.conf;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=604800" always;
  }

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
